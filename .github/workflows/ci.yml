name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Security & constraint checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Project constraints (CLAUDE.md hard rules)
        shell: bash
        run: |
          fail=0
          for f in index.html v2/index.html; do
            check() {  # check "<description>" "<regex>"
              if grep -nEi "$2" "$f"; then
                echo "::error file=$f::$1"
                fail=1
              fi
            }
            check "External script/stylesheet/@import (no CDNs or web fonts)" '<script[^>]+src=|<link[^>]+href=["'"'"']?https?:|@import'
            check "Browser storage is not allowed (no persistence)"          'localStorage|sessionStorage|indexedDB|document\.cookie'
            check "Browser dialogs are not allowed"                          '\balert\(|\bconfirm\('
            check "!important is not allowed"                                '!important'
            others=$(grep -oEi 'https?://[^"'"'"' )<>;]+' "$f" | grep -viE '^https?://formsubmit\.co(/|$)' || true)
            if [ -n "$others" ]; then
              echo "$others"
              echo "::error file=$f::Only formsubmit.co may be referenced"
              fail=1
            fi
          done
          exit $fail

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: v2 hardening (CSP hashes match inline script/style, no unsafe-inline)
        run: node tools/csp.mjs v2/index.html

      - name: Validate HTML (html-validate, run via npx; no repo dependencies)
        run: npx --yes html-validate@8 index.html v2/index.html

  deploy:
    name: Deploy to GitHub Pages
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Stage site files (only what the page needs)
        run: |
          mkdir -p _site/v2
          cp index.html _site/              # original board stays at the site root
          cp v2/index.html _site/v2/        # retro redesign lives at /v2/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
