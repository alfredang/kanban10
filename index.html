<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IT PMO — Kanban Board (Demo)</title>
<style>
  /* =========================================================
     1. Design tokens: palette, spacing scale, typography
     ========================================================= */
  :root {
    --c-primary-900: #06224f;
    --c-primary-800: #0a2f6b;
    --c-primary: #0b3d91;
    --c-primary-600: #1652b8;
    --c-primary-100: #e6eefb;
    --c-primary-50: #f3f7fd;

    --c-bg: #f4f6fa;
    --c-surface: #ffffff;
    --c-border: #d6dce7;
    --c-text: #1b2433;
    --c-text-muted: #5a6577;
    --c-focus: #ffb703;

    --c-critical: #c62828;
    --c-critical-bg: #fdecec;
    --c-high: #d98200;
    --c-high-bg: #fff4e0;
    --c-medium: #1e63d6;
    --c-medium-bg: #e7f0fd;
    --c-low: #7a8494;
    --c-low-bg: #eef0f3;

    --c-success: #1b7f4b;
    --c-warning: #a35d00;
    --c-info: #0b3d91;

    --sp-1: 0.25rem;
    --sp-2: 0.5rem;
    --sp-3: 0.75rem;
    --sp-4: 1rem;
    --sp-5: 1.5rem;
    --sp-6: 2rem;

    --radius-sm: 4px;
    --radius: 8px;
    --radius-lg: 12px;
    --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.08);
    --shadow: 0 4px 12px rgba(16, 24, 40, 0.12);
    --shadow-lg: 0 16px 40px rgba(16, 24, 40, 0.25);

    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
  }

  /* =========================================================
     2. Base / reset
     ========================================================= */
  *, *::before, *::after { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font);
    font-size: 15px;
    line-height: 1.45;
    color: var(--c-text);
    background: var(--c-bg);
  }
  h1, h2, h3, p { margin: 0; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible {
    outline: 3px solid var(--c-focus);
    outline-offset: 2px;
  }
  .sr-only {
    position: absolute;
    width: 1px; height: 1px;
    padding: 0; margin: -1px;
    overflow: hidden; clip: rect(0 0 0 0);
    white-space: nowrap; border: 0;
  }

  /* =========================================================
     3. Buttons and form controls
     ========================================================= */
  .btn {
    display: inline-flex;
    align-items: center;
    gap: var(--sp-1);
    padding: var(--sp-2) var(--sp-4);
    border-radius: var(--radius-sm);
    border: 1px solid transparent;
    font-weight: 600;
    line-height: 1.2;
  }
  .btn-primary { background: var(--c-primary); color: #fff; }
  .btn-primary:hover { background: var(--c-primary-600); }
  .btn-primary[disabled] { background: var(--c-low); cursor: progress; }
  .btn-light { background: #fff; color: var(--c-primary); border-color: #fff; }
  .btn-light:hover { background: var(--c-primary-100); }
  .btn-ghost { background: transparent; color: var(--c-primary); border-color: var(--c-border); }
  .btn-ghost:hover { background: var(--c-primary-50); }

  .field { display: flex; flex-direction: column; gap: var(--sp-1); }
  .field label { font-size: 0.85rem; font-weight: 600; color: var(--c-text-muted); }
  .field input, .field select, .field textarea {
    padding: var(--sp-2) var(--sp-3);
    border: 1px solid var(--c-border);
    border-radius: var(--radius-sm);
    background: #fff;
    min-width: 0;
  }
  .field textarea { resize: vertical; min-height: 5rem; }
  .field [aria-invalid="true"] { border-color: var(--c-critical); background: var(--c-critical-bg); }
  .field .error { min-height: 1.1em; font-size: 0.8rem; color: var(--c-critical); }
  .field .hint { font-size: 0.75rem; color: var(--c-text-muted); }
  .req { color: var(--c-critical); }

  /* =========================================================
     4. Header: wordmark, summary strip, demo note
     ========================================================= */
  .app-header {
    background: linear-gradient(90deg, var(--c-primary-900), var(--c-primary));
    color: #fff;
    padding: var(--sp-4) var(--sp-5);
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: var(--sp-4) var(--sp-5);
  }
  .brand { display: flex; flex-direction: column; gap: var(--sp-1); }
  .wordmark {
    font-size: 1.5rem;
    font-weight: 800;
    letter-spacing: 0.04em;
    display: flex;
    align-items: center;
    gap: var(--sp-2);
  }
  .wordmark .tag {
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    padding: 2px var(--sp-2);
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 999px;
  }
  .demo-note { font-size: 0.75rem; opacity: 0.85; }

  .summary {
    display: flex;
    flex-wrap: wrap;
    gap: var(--sp-2);
    margin: 0;
    flex: 1;
  }
  .summary div {
    background: rgba(255, 255, 255, 0.12);
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: var(--radius);
    padding: var(--sp-1) var(--sp-3);
    min-width: 5.5rem;
  }
  .summary dt { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.85; }
  .summary dd { margin: 0; font-size: 1.25rem; font-weight: 700; }
  .summary .is-alert { background: rgba(198, 40, 40, 0.35); border-color: rgba(255, 180, 180, 0.6); }

  /* =========================================================
     5. Filter bar
     ========================================================= */
  main { padding: var(--sp-4) var(--sp-5) var(--sp-6); }
  .filters {
    display: flex;
    flex-wrap: wrap;
    align-items: flex-end;
    gap: var(--sp-3);
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-radius: var(--radius);
    padding: var(--sp-3) var(--sp-4);
    margin-bottom: var(--sp-4);
    box-shadow: var(--shadow-sm);
  }
  .filters .field { min-width: 12rem; flex: 1; }
  .filters .filter-status { font-size: 0.85rem; color: var(--c-text-muted); align-self: center; }

  /* =========================================================
     6. Board and columns
     ========================================================= */
  .board {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: var(--sp-4);
    align-items: start;
  }
  .column {
    background: #e9edf4;
    border: 2px solid transparent;
    border-radius: var(--radius-lg);
    padding: var(--sp-3);
    min-height: 12rem;
    transition: background-color 0.15s, border-color 0.15s;
  }
  .column.drag-over {
    background: var(--c-primary-100);
    border: 2px dashed var(--c-primary);
  }
  .column-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-2);
    padding: var(--sp-1) var(--sp-1) var(--sp-3);
  }
  .column-header h2 { font-size: 1rem; }
  .column-header h2:focus { outline: none; }
  .column-header h2:focus-visible { outline: 3px solid var(--c-focus); }
  .column-desc { font-size: 0.75rem; color: var(--c-text-muted); font-weight: 400; display: block; }
  .count-badge {
    background: var(--c-primary);
    color: #fff;
    border-radius: 999px;
    padding: 0 var(--sp-2);
    font-size: 0.8rem;
    font-weight: 700;
    min-width: 1.75rem;
    text-align: center;
  }
  .card-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: var(--sp-3); min-height: 4rem; }
  .empty { font-size: 0.85rem; color: var(--c-text-muted); text-align: center; padding: var(--sp-4) 0; border: 1px dashed var(--c-border); border-radius: var(--radius); }

  /* =========================================================
     7. Task cards
     ========================================================= */
  .card {
    background: var(--c-surface);
    border: 1px solid var(--c-border);
    border-left: 6px solid var(--c-low);
    border-radius: var(--radius);
    padding: var(--sp-3);
    box-shadow: var(--shadow-sm);
    cursor: grab;
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
  }
  .card:hover { box-shadow: var(--shadow); }
  .card.dragging { opacity: 0.45; cursor: grabbing; }
  .card.prio-critical { border-left-color: var(--c-critical); }
  .card.prio-high { border-left-color: var(--c-high); }
  .card.prio-medium { border-left-color: var(--c-medium); }
  .card.prio-low { border-left-color: var(--c-low); }

  .card-top { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); }
  .task-id { font-family: var(--font-mono); font-size: 0.75rem; color: var(--c-text-muted); }
  .card-title { font-size: 0.95rem; font-weight: 650; overflow-wrap: anywhere; }
  .card-desc { font-size: 0.8rem; color: var(--c-text-muted); overflow-wrap: anywhere; }
  .meta { display: grid; grid-template-columns: auto 1fr; gap: 2px var(--sp-2); font-size: 0.8rem; margin: 0; }
  .meta dt { color: var(--c-text-muted); }
  .meta dd { margin: 0; overflow-wrap: anywhere; }
  .badges { display: flex; flex-wrap: wrap; gap: var(--sp-1); }

  .pill, .tag-cat, .badge-overdue {
    display: inline-flex;
    align-items: center;
    gap: 3px;
    font-size: 0.72rem;
    font-weight: 700;
    padding: 1px var(--sp-2);
    border-radius: 999px;
    border: 1px solid transparent;
    white-space: nowrap;
  }
  .pill-critical { background: var(--c-critical-bg); color: var(--c-critical); border-color: var(--c-critical); }
  .pill-high { background: var(--c-high-bg); color: #8a5300; border-color: var(--c-high); }
  .pill-medium { background: var(--c-medium-bg); color: var(--c-medium); border-color: var(--c-medium); }
  .pill-low { background: var(--c-low-bg); color: #4a5361; border-color: var(--c-low); }
  .tag-cat { background: var(--c-primary-50); color: var(--c-primary-800); border-color: var(--c-primary-100); font-weight: 600; }
  .badge-overdue { background: var(--c-critical-bg); color: var(--c-critical); border-color: #f3b4b4; }

  .card-actions { display: flex; align-items: center; justify-content: space-between; gap: var(--sp-2); border-top: 1px solid var(--c-border); padding-top: var(--sp-2); }
  .move-wrap { display: flex; align-items: center; gap: var(--sp-1); font-size: 0.8rem; }
  .move-select {
    font-size: 0.8rem;
    padding: 2px var(--sp-1);
    border: 1px solid var(--c-border);
    border-radius: var(--radius-sm);
    background: var(--c-primary-50);
    color: var(--c-primary);
    font-weight: 600;
  }
  .icon-btn {
    border: 1px solid transparent;
    background: transparent;
    border-radius: var(--radius-sm);
    width: 1.75rem;
    height: 1.75rem;
    line-height: 1;
    font-size: 1.15rem;
    color: var(--c-text-muted);
  }
  .icon-btn:hover { background: var(--c-critical-bg); color: var(--c-critical); }

  .confirm-delete { display: flex; align-items: center; gap: var(--sp-2); font-size: 0.85rem; font-weight: 600; color: var(--c-critical); }
  .confirm-delete button { padding: 2px var(--sp-3); border-radius: var(--radius-sm); font-size: 0.8rem; font-weight: 600; }
  .btn-danger { background: var(--c-critical); color: #fff; border: 1px solid var(--c-critical); }
  .btn-secondary { background: #fff; color: var(--c-text); border: 1px solid var(--c-border); }

  /* =========================================================
     8. Modal (Add Task)
     ========================================================= */
  .modal-backdrop {
    position: fixed;
    inset: 0;
    background: rgba(6, 34, 79, 0.55);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: var(--sp-6) var(--sp-4);
    overflow-y: auto;
    z-index: 50;
  }
  .modal-backdrop[hidden] { display: none; }
  .modal {
    background: var(--c-surface);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-lg);
    width: 100%;
    max-width: 40rem;
  }
  .modal-head { display: flex; align-items: center; justify-content: space-between; padding: var(--sp-4) var(--sp-5); border-bottom: 1px solid var(--c-border); }
  .modal-head h2 { font-size: 1.15rem; color: var(--c-primary-800); }
  .modal-head .icon-btn:hover { background: var(--c-primary-50); color: var(--c-primary); }
  .modal form { padding: var(--sp-4) var(--sp-5) var(--sp-5); }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--sp-2) var(--sp-4); }
  .form-grid .span-2 { grid-column: 1 / -1; }
  .form-actions { display: flex; justify-content: flex-end; gap: var(--sp-2); margin-top: var(--sp-3); }

  /* =========================================================
     9. Toasts
     ========================================================= */
  .toast-region {
    position: fixed;
    right: var(--sp-4);
    bottom: var(--sp-4);
    display: flex;
    flex-direction: column;
    gap: var(--sp-2);
    z-index: 100;
    max-width: min(24rem, calc(100vw - 2rem));
  }
  .toast {
    background: var(--c-surface);
    border-left: 5px solid var(--c-info);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: var(--sp-3) var(--sp-4);
    font-size: 0.9rem;
    display: flex;
    gap: var(--sp-2);
    align-items: flex-start;
    animation: toast-in 0.2s ease-out;
  }
  .toast-success { border-left-color: var(--c-success); }
  .toast-warning { border-left-color: var(--c-warning); background: #fffaf0; }
  .toast-icon { font-weight: 800; }
  .toast-success .toast-icon { color: var(--c-success); }
  .toast-warning .toast-icon { color: var(--c-warning); }
  .toast-info .toast-icon { color: var(--c-info); }
  @keyframes toast-in { from { transform: translateY(8px); opacity: 0; } to { transform: none; opacity: 1; } }

  /* =========================================================
     10. Responsive: stack columns below 768px
     ========================================================= */
  @media (max-width: 767px) {
    .app-header { padding: var(--sp-3) var(--sp-4); }
    main { padding: var(--sp-3) var(--sp-3) var(--sp-5); }
    .board { grid-template-columns: 1fr; }
    .form-grid { grid-template-columns: 1fr; }
    .filters .field { min-width: 100%; }
  }
  @media (prefers-reduced-motion: reduce) {
    .toast { animation: none; }
    .column { transition: none; }
  }
</style>
</head>
<body>

<!-- =========================================================
     Header: wordmark, live summary strip, Add Task button
     ========================================================= -->
<header class="app-header">
  <div class="brand">
    <div class="wordmark">IT PMO <span class="tag">Demo</span></div>
    <p class="demo-note">Training demo. Data lives in memory only and resets to the sample tasks when you refresh the page.</p>
  </div>

  <dl class="summary" aria-label="Board summary">
    <div><dt>Total</dt><dd id="sum-total">0</dd></div>
    <div><dt>Backlog</dt><dd id="sum-backlog">0</dd></div>
    <div><dt>In Progress</dt><dd id="sum-inprogress">0</dd></div>
    <div><dt>Blocked</dt><dd id="sum-blocked">0</dd></div>
    <div><dt>Done</dt><dd id="sum-done">0</dd></div>
    <div id="sum-overdue-wrap"><dt>Overdue</dt><dd id="sum-overdue">0</dd></div>
  </dl>

  <button type="button" class="btn btn-light" id="open-add">
    <span aria-hidden="true">+</span> Add Task
  </button>
</header>

<main>
  <!-- =========================================================
       Filter bar (client-side only)
       ========================================================= -->
  <section aria-label="Filters">
    <form class="filters" id="filter-form" role="search" onsubmit="return false;">
      <div class="field">
        <label for="filter-project">Project / Workstream</label>
        <select id="filter-project" name="project"></select>
      </div>
      <div class="field">
        <label for="filter-assignee">Assignee contains</label>
        <input type="text" id="filter-assignee" name="assignee" placeholder="e.g. Tan" autocomplete="off">
      </div>
      <div class="field">
        <label for="filter-priority">Priority</label>
        <select id="filter-priority" name="priority"></select>
      </div>
      <button type="reset" class="btn btn-ghost" id="filter-clear">Clear filters</button>
      <p class="filter-status" id="filter-status" aria-live="polite"></p>
    </form>
  </section>

  <!-- =========================================================
       Kanban board: columns are generated from STATUSES
       ========================================================= -->
  <section class="board" id="board" aria-label="Kanban board"></section>
</main>

<!-- =========================================================
     Add Task modal
     ========================================================= -->
<div class="modal-backdrop" id="modal-backdrop" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" id="modal">
    <div class="modal-head">
      <h2 id="modal-title">Add Task</h2>
      <button type="button" class="icon-btn" id="close-add" aria-label="Close Add Task dialog">&times;</button>
    </div>
    <form id="task-form" novalidate>
      <div class="form-grid">
        <div class="field span-2">
          <label for="f-title">Task Title <span class="req" aria-hidden="true">*</span></label>
          <input type="text" id="f-title" name="title" maxlength="80" required aria-describedby="f-title-error">
          <p class="error" id="f-title-error"></p>
        </div>
        <div class="field span-2">
          <label for="f-description">Description</label>
          <textarea id="f-description" name="description" maxlength="500" aria-describedby="f-description-hint f-description-error"></textarea>
          <span class="hint" id="f-description-hint">Optional, up to 500 characters.</span>
          <p class="error" id="f-description-error"></p>
        </div>
        <div class="field">
          <label for="f-project">Project / Workstream <span class="req" aria-hidden="true">*</span></label>
          <select id="f-project" name="project" required aria-describedby="f-project-error"></select>
          <p class="error" id="f-project-error"></p>
        </div>
        <div class="field">
          <label for="f-category">Category <span class="req" aria-hidden="true">*</span></label>
          <select id="f-category" name="category" required aria-describedby="f-category-error"></select>
          <p class="error" id="f-category-error"></p>
        </div>
        <div class="field">
          <label for="f-assignee">Assignee <span class="req" aria-hidden="true">*</span></label>
          <input type="text" id="f-assignee" name="assignee" maxlength="60" required autocomplete="off" aria-describedby="f-assignee-error">
          <p class="error" id="f-assignee-error"></p>
        </div>
        <div class="field">
          <label for="f-priority">Priority</label>
          <select id="f-priority" name="priority" aria-describedby="f-priority-error"></select>
          <p class="error" id="f-priority-error"></p>
        </div>
        <div class="field">
          <label for="f-dueDate">Due Date <span class="req" aria-hidden="true">*</span></label>
          <input type="date" id="f-dueDate" name="dueDate" required aria-describedby="f-dueDate-error">
          <p class="error" id="f-dueDate-error"></p>
        </div>
        <div class="field">
          <label for="f-status">Status</label>
          <select id="f-status" name="status" aria-describedby="f-status-error"></select>
          <p class="error" id="f-status-error"></p>
        </div>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" id="cancel-add">Close</button>
        <button type="submit" class="btn btn-primary" id="submit-btn">Add Task</button>
      </div>
    </form>
  </div>
</div>

<!-- Toast region: announced politely to screen readers -->
<div class="toast-region" id="toast-region" aria-live="polite" role="status"></div>

<!--
  FormSubmit configuration
  ------------------------
  New tasks trigger an email through FormSubmit (https://formsubmit.co) using its AJAX endpoint.
  ONE-TIME ACTIVATION: the first submission to a new address does NOT deliver a task email.
  Instead, FormSubmit sends a confirmation email to that address. Submissions only start
  delivering after someone clicks the activation link in that email.
  To change the destination, edit FORMSUBMIT_ENDPOINT at the top of the script below.
-->
<script>
"use strict";

/* =========================================================
   1. CONFIG: change the destination email address here only
   ========================================================= */
const FORMSUBMIT_ENDPOINT = "https://formsubmit.co/ajax/YOUR_EMAIL@example.com";
const TASK_ID_PREFIX = "UOB-ITPM-";      // Task IDs look like UOB-ITPM-0001
const EMAIL_SUBJECT_PREFIX = "[UOB IT PMO]";

const STATUSES = [
  { key: "Backlog",     desc: "Logged, not yet scheduled" },
  { key: "In Progress", desc: "Actively being worked" },
  { key: "Blocked",     desc: "Waiting on a dependency, vendor or approval" },
  { key: "Done",        desc: "Completed / closed" },
];
const STATUS_KEYS = STATUSES.map(s => s.key);
const PROJECTS = [
  "Core Banking Upgrade", "Digital Channels", "Cybersecurity Uplift",
  "Data & Analytics", "Infrastructure & Cloud", "Vendor Management",
];
const CATEGORIES = [
  "Application Development", "Infrastructure", "Cybersecurity",
  "Data", "Compliance", "Vendor",
];
const PRIORITIES = ["Critical", "High", "Medium", "Low"];

/* =========================================================
   2. STATE: single source of truth (in memory only)
   ========================================================= */
const state = {
  tasks: [],
  filters: { project: "", assignee: "", priority: "" },
};

// Transient UI state that renderBoard() reads when it builds cards.
const ui = {
  pendingDeleteId: null,   // card currently showing "Delete? Yes / No"
  focusAfterRender: null,  // CSS selector to focus after the next render
};

let nextIdNumber = 1;
let requestsInFlight = 0;

/* =========================================================
   3. UTILITIES
   ========================================================= */
function escapeHtml(value) {
  return String(value == null ? "" : value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#39;");
}

// Local date as YYYY-MM-DD (avoid UTC drift from toISOString()).
function toISODate(date) {
  const y = date.getFullYear();
  const m = String(date.getMonth() + 1).padStart(2, "0");
  const d = String(date.getDate()).padStart(2, "0");
  return `${y}-${m}-${d}`;
}
function todayISO() { return toISODate(new Date()); }
function daysFromToday(n) {
  const d = new Date();
  d.setDate(d.getDate() + n);
  return toISODate(d);
}

function isOverdue(task) {
  return task.status !== "Done" && task.dueDate < todayISO();
}

function formatDate(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { day: "2-digit", month: "short", year: "numeric" });
}

function generateId() {
  return TASK_ID_PREFIX + String(nextIdNumber++).padStart(4, "0");
}

function statusSlug(status) { return status.toLowerCase().replace(/\s+/g, ""); }

function findTask(id) { return state.tasks.find(t => t.id === id); }

function fillSelect(select, options, { placeholder, selected } = {}) {
  const parts = [];
  if (placeholder !== undefined) parts.push(`<option value="">${escapeHtml(placeholder)}</option>`);
  options.forEach(opt => {
    const sel = opt === selected ? " selected" : "";
    parts.push(`<option value="${escapeHtml(opt)}"${sel}>${escapeHtml(opt)}</option>`);
  });
  select.innerHTML = parts.join("");
}

/* =========================================================
   5. FILTERING (pure function over the in-memory array)
   ========================================================= */
function applyFilters(tasks) {
  const { project, assignee, priority } = state.filters;
  const needle = assignee.trim().toLowerCase();
  return tasks.filter(t =>
    (!project || t.project === project) &&
    (!priority || t.priority === priority) &&
    (!needle || t.assignee.toLowerCase().includes(needle))
  );
}

function hasActiveFilters() {
  const f = state.filters;
  return Boolean(f.project || f.priority || f.assignee.trim());
}

/* =========================================================
   6. RENDERING
   ========================================================= */
function renderCard(task) {
  const id = escapeHtml(task.id);
  const title = escapeHtml(task.title);
  const prio = task.priority.toLowerCase();
  const overdue = isOverdue(task);
  const domId = "move-" + statusSlug(task.id);

  const moveOptions = STATUS_KEYS
    .filter(s => s !== task.status)
    .map(s => `<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`)
    .join("");

  const actions = ui.pendingDeleteId === task.id
    ? `<div class="confirm-delete" role="group" aria-label="Confirm delete ${id}">
         <span>Delete?</span>
         <button type="button" class="btn-danger" data-action="confirm-delete" data-id="${id}">Yes</button>
         <button type="button" class="btn-secondary" data-action="cancel-delete" data-id="${id}">No</button>
       </div>`
    : `<div class="move-wrap">
         <label for="${domId}" class="sr-only">Move ${id} to column</label>
         <select id="${domId}" class="move-select" data-action="move" data-id="${id}">
           <option value="" selected>Move ▸</option>
           ${moveOptions}
         </select>
       </div>
       <button type="button" class="icon-btn" data-action="delete" data-id="${id}" aria-label="Delete task ${id}: ${title}">&times;</button>`;

  return `
    <li class="card prio-${prio}" draggable="true" data-id="${id}" aria-label="${id}: ${title}">
      <div class="card-top">
        <span class="task-id">${id}</span>
        <div class="badges">
          ${overdue ? `<span class="badge-overdue"><span aria-hidden="true">⚠</span> Overdue</span>` : ""}
          <span class="pill pill-${prio}">${escapeHtml(task.priority)}</span>
        </div>
      </div>
      <h3 class="card-title">${title}</h3>
      ${task.description ? `<p class="card-desc">${escapeHtml(task.description)}</p>` : ""}
      <dl class="meta">
        <dt>Project</dt><dd>${escapeHtml(task.project)}</dd>
        <dt>Assignee</dt><dd>${escapeHtml(task.assignee)}</dd>
        <dt>Due</dt><dd><time datetime="${escapeHtml(task.dueDate)}">${escapeHtml(formatDate(task.dueDate))}</time></dd>
      </dl>
      <div class="badges"><span class="tag-cat">${escapeHtml(task.category)}</span></div>
      <div class="card-actions">${actions}</div>
    </li>`;
}

function renderSummary() {
  const counts = { total: state.tasks.length, overdue: 0 };
  STATUS_KEYS.forEach(s => { counts[statusSlug(s)] = 0; });
  state.tasks.forEach(t => {
    counts[statusSlug(t.status)]++;
    if (isOverdue(t)) counts.overdue++;
  });
  document.getElementById("sum-total").textContent = counts.total;
  STATUS_KEYS.forEach(s => {
    document.getElementById("sum-" + statusSlug(s)).textContent = counts[statusSlug(s)];
  });
  document.getElementById("sum-overdue").textContent = counts.overdue;
  document.getElementById("sum-overdue-wrap").classList.toggle("is-alert", counts.overdue > 0);
}

function renderBoard() {
  const board = document.getElementById("board");
  const visible = applyFilters(state.tasks);

  board.innerHTML = STATUSES.map(({ key, desc }) => {
    const slug = statusSlug(key);
    const tasks = visible.filter(t => t.status === key);
    const cards = tasks.length
      ? tasks.map(renderCard).join("")
      : `<li class="empty">${hasActiveFilters() ? "No matching tasks" : "No tasks"}</li>`;
    return `
      <section class="column" data-status="${escapeHtml(key)}" aria-labelledby="col-${slug}">
        <div class="column-header">
          <h2 id="col-${slug}" tabindex="-1">${escapeHtml(key)}<span class="column-desc">${escapeHtml(desc)}</span></h2>
          <span class="count-badge" aria-label="${tasks.length} tasks">${tasks.length}</span>
        </div>
        <ul class="card-list">${cards}</ul>
      </section>`;
  }).join("");

  renderSummary();

  const status = document.getElementById("filter-status");
  status.textContent = hasActiveFilters()
    ? `Showing ${visible.length} of ${state.tasks.length} tasks`
    : "";

  if (ui.focusAfterRender) {
    const el = board.querySelector(ui.focusAfterRender);
    if (el) el.focus();
    ui.focusAfterRender = null;
  }
}

/* =========================================================
   7. ACTIONS: mutate state, then re-render
   ========================================================= */
function addTask(data) {
  const task = {
    id: generateId(),
    title: data.title.trim(),
    description: data.description.trim(),
    project: data.project,
    category: data.category,
    assignee: data.assignee.trim(),
    priority: data.priority,
    dueDate: data.dueDate,
    status: data.status,
  };
  state.tasks.push(task);
  renderBoard();
  return task;
}

function moveTask(id, newStatus) {
  const task = findTask(id);
  if (!task || !STATUS_KEYS.includes(newStatus) || task.status === newStatus) return;
  task.status = newStatus;
  ui.pendingDeleteId = null;
  renderBoard();
  showToast(`${task.id} moved to ${newStatus}`, "info");
}

function deleteTask(id) {
  const task = findTask(id);
  if (!task) return;
  state.tasks = state.tasks.filter(t => t.id !== id);
  ui.pendingDeleteId = null;
  ui.focusAfterRender = `#col-${statusSlug(task.status)}`;
  renderBoard();
  showToast(`${task.id} deleted`, "info");
}

/* =========================================================
   8. TOASTS (non-blocking, announced via aria-live)
   ========================================================= */
function showToast(message, type = "info", duration = 4000) {
  const region = document.getElementById("toast-region");
  const icons = { success: "✓", warning: "!", info: "i" };
  const toast = document.createElement("div");
  toast.className = `toast toast-${type}`;
  toast.innerHTML = `<span class="toast-icon" aria-hidden="true">${icons[type] || "i"}</span><span>${escapeHtml(message)}</span>`;
  region.appendChild(toast);
  setTimeout(() => toast.remove(), duration);
}

/* =========================================================
   9. FORMSUBMIT INTEGRATION (AJAX JSON endpoint)
   ========================================================= */
async function notifyNewTask(task) {
  if (FORMSUBMIT_ENDPOINT.includes("YOUR_EMAIL@example.com")) {
    // Not configured: skip the network call instead of posting to a placeholder address.
    throw new Error("FormSubmit endpoint not configured");
  }
  const res = await fetch(FORMSUBMIT_ENDPOINT, {
    method: "POST",
    headers: { "Content-Type": "application/json", Accept: "application/json" },
    body: JSON.stringify({
      _subject: `${EMAIL_SUBJECT_PREFIX} New task ${task.id}: ${task.title}`,
      _template: "table",
      _captcha: "false",
      "Task ID": task.id,
      Title: task.title,
      Description: task.description,
      Project: task.project,
      Category: task.category,
      Assignee: task.assignee,
      Priority: task.priority,
      "Due Date": task.dueDate,
      Status: task.status,
      "Submitted At": new Date().toISOString(),
    }),
  });
  if (!res.ok) throw new Error(`FormSubmit failed: ${res.status}`);
  const json = await res.json();
  // FormSubmit can return HTTP 200 with success:"false" (e.g. not yet activated).
  if (json && String(json.success) === "false") throw new Error(json.message || "FormSubmit rejected the submission");
  return json;
}

/* =========================================================
   10. ADD TASK FORM: validation, submit, modal handling
   ========================================================= */
const FORM_FIELDS = ["title", "description", "project", "category", "assignee", "priority", "dueDate", "status"];

function readForm(form) {
  const data = {};
  FORM_FIELDS.forEach(name => { data[name] = form.elements[name].value; });
  return data;
}

function validateForm(data) {
  const errors = {};
  const title = data.title.trim();
  if (!title) errors.title = "Task title is required.";
  else if (title.length > 80) errors.title = "Title must be 80 characters or fewer.";

  if (data.description.length > 500) errors.description = "Description must be 500 characters or fewer.";
  if (!PROJECTS.includes(data.project)) errors.project = "Choose a project / workstream.";
  if (!CATEGORIES.includes(data.category)) errors.category = "Choose a category.";
  if (!data.assignee.trim()) errors.assignee = "Assignee is required.";
  if (!PRIORITIES.includes(data.priority)) errors.priority = "Choose a priority.";

  if (!data.dueDate) errors.dueDate = "Due date is required.";
  else if (!/^\d{4}-\d{2}-\d{2}$/.test(data.dueDate)) errors.dueDate = "Enter a valid date.";
  else if (data.dueDate < todayISO()) errors.dueDate = "Due date cannot be in the past.";

  if (!STATUS_KEYS.includes(data.status)) errors.status = "Choose a status.";
  return errors;
}

function showFieldErrors(form, errors) {
  FORM_FIELDS.forEach(name => {
    const input = form.elements[name];
    const msg = errors[name] || "";
    document.getElementById(`f-${name}-error`).textContent = msg;
    if (msg) input.setAttribute("aria-invalid", "true");
    else input.removeAttribute("aria-invalid");
  });
  const first = FORM_FIELDS.find(name => errors[name]);
  if (first) form.elements[first].focus();
}

function resetTaskForm(form) {
  form.reset();
  form.elements.priority.value = "Medium";
  form.elements.status.value = "Backlog";
  form.elements.dueDate.min = todayISO();
  showFieldErrors(form, {});
}

function setSending(isSending) {
  const btn = document.getElementById("submit-btn");
  btn.disabled = isSending;
  btn.textContent = isSending ? "Sending…" : "Add Task";
  btn.setAttribute("aria-busy", String(isSending));
}

async function handleSubmit(event) {
  event.preventDefault();
  const form = event.currentTarget;
  if (requestsInFlight > 0) return;

  const data = readForm(form);
  const errors = validateForm(data);
  showFieldErrors(form, errors);
  if (Object.keys(errors).length) return;

  // Optimistic UI: the card appears on the board right away.
  const task = addTask(data);
  resetTaskForm(form);
  showToast(`${task.id} added to ${task.status}`, "success");

  // Email notification runs alongside; a failure never touches the board.
  requestsInFlight++;
  setSending(true);
  try {
    await notifyNewTask(task);
    showToast(`Email notification sent for ${task.id}`, "info");
  } catch (err) {
    console.warn(err);
    showToast("Card added locally — email notification failed", "warning", 6000);
  } finally {
    requestsInFlight--;
    if (requestsInFlight === 0) setSending(false);
    form.elements.title.focus();
  }
}

// Modal open / close with focus trap and focus restore
let lastFocused = null;

function openModal() {
  const backdrop = document.getElementById("modal-backdrop");
  lastFocused = document.activeElement;
  document.getElementById("f-dueDate").min = todayISO();
  backdrop.hidden = false;
  document.getElementById("f-title").focus();
}

function closeModal() {
  document.getElementById("modal-backdrop").hidden = true;
  if (lastFocused && typeof lastFocused.focus === "function") lastFocused.focus();
}

function trapFocus(event) {
  if (event.key === "Escape") { event.preventDefault(); closeModal(); return; }
  if (event.key !== "Tab") return;
  const focusables = Array.from(document.getElementById("modal")
    .querySelectorAll("button, input, select, textarea, [tabindex]:not([tabindex='-1'])"))
    .filter(el => !el.disabled);
  if (!focusables.length) return;
  const first = focusables[0];
  const last = focusables[focusables.length - 1];
  if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
  else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
}

/* =========================================================
   11. BOARD EVENTS: drag & drop, move control, delete flow
   ========================================================= */
function wireBoardEvents() {
  const board = document.getElementById("board");

  // --- Native HTML5 drag and drop ---
  board.addEventListener("dragstart", e => {
    const card = e.target.closest(".card");
    if (!card) return;
    e.dataTransfer.setData("text/plain", card.dataset.id);
    e.dataTransfer.effectAllowed = "move";
    card.classList.add("dragging");
  });

  board.addEventListener("dragend", e => {
    const card = e.target.closest(".card");
    if (card) card.classList.remove("dragging");
    board.querySelectorAll(".column.drag-over").forEach(c => c.classList.remove("drag-over"));
  });

  board.addEventListener("dragover", e => {
    const column = e.target.closest(".column");
    if (!column) return;
    e.preventDefault();
    e.dataTransfer.dropEffect = "move";
    if (!column.classList.contains("drag-over")) {
      board.querySelectorAll(".column.drag-over").forEach(c => c.classList.remove("drag-over"));
      column.classList.add("drag-over");
    }
  });

  board.addEventListener("dragleave", e => {
    const column = e.target.closest(".column");
    if (column && !column.contains(e.relatedTarget)) column.classList.remove("drag-over");
  });

  board.addEventListener("drop", e => {
    const column = e.target.closest(".column");
    if (!column) return;
    e.preventDefault();
    column.classList.remove("drag-over");
    const id = e.dataTransfer.getData("text/plain");
    if (id) moveTask(id, column.dataset.status);
  });

  // --- Keyboard-accessible "Move ▸" control ---
  board.addEventListener("change", e => {
    const select = e.target.closest('[data-action="move"]');
    if (!select || !select.value) return;
    const id = select.dataset.id;
    ui.focusAfterRender = `#move-${statusSlug(id)}`;
    moveTask(id, select.value);
  });

  // --- Delete with inline confirm ---
  board.addEventListener("click", e => {
    const btn = e.target.closest("button[data-action]");
    if (!btn) return;
    const id = btn.dataset.id;
    const sel = `[data-id="${CSS.escape(id)}"]`;
    if (btn.dataset.action === "delete") {
      ui.pendingDeleteId = id;
      ui.focusAfterRender = `${sel}[data-action="cancel-delete"]`;
      renderBoard();
    } else if (btn.dataset.action === "cancel-delete") {
      ui.pendingDeleteId = null;
      ui.focusAfterRender = `${sel}[data-action="delete"]`;
      renderBoard();
    } else if (btn.dataset.action === "confirm-delete") {
      deleteTask(id);
    }
  });

  board.addEventListener("keydown", e => {
    if (e.key === "Escape" && ui.pendingDeleteId) {
      const sel = `[data-id="${CSS.escape(ui.pendingDeleteId)}"][data-action="delete"]`;
      ui.pendingDeleteId = null;
      ui.focusAfterRender = sel;
      renderBoard();
    }
  });
}

/* =========================================================
   12. FILTER EVENTS
   ========================================================= */
function wireFilterEvents() {
  const form = document.getElementById("filter-form");
  const update = () => {
    state.filters.project = form.elements.project.value;
    state.filters.assignee = form.elements.assignee.value;
    state.filters.priority = form.elements.priority.value;
    renderBoard();
  };
  form.addEventListener("input", update);
  form.addEventListener("change", update);
  // "reset" fires before the fields clear, so update on the next tick.
  form.addEventListener("reset", () => setTimeout(update, 0));
}

/* =========================================================
   13. INIT
   ========================================================= */
function init() {
  // Populate selects from config lists
  fillSelect(document.getElementById("filter-project"), PROJECTS, { placeholder: "All projects" });
  fillSelect(document.getElementById("filter-priority"), PRIORITIES, { placeholder: "All priorities" });
  fillSelect(document.getElementById("f-project"), PROJECTS, { placeholder: "Select a project…" });
  fillSelect(document.getElementById("f-category"), CATEGORIES, { placeholder: "Select a category…" });
  fillSelect(document.getElementById("f-priority"), PRIORITIES, { selected: "Medium" });
  fillSelect(document.getElementById("f-status"), STATUS_KEYS, { selected: "Backlog" });

  const taskForm = document.getElementById("task-form");
  resetTaskForm(taskForm);
  taskForm.addEventListener("submit", handleSubmit);

  document.getElementById("open-add").addEventListener("click", openModal);
  document.getElementById("close-add").addEventListener("click", closeModal);
  document.getElementById("cancel-add").addEventListener("click", closeModal);
  document.getElementById("modal").addEventListener("keydown", trapFocus);
  document.getElementById("modal-backdrop").addEventListener("mousedown", e => {
    if (e.target === e.currentTarget) closeModal();
  });

  wireBoardEvents();
  wireFilterEvents();

  seedTasks();
  renderBoard();
}

document.addEventListener("DOMContentLoaded", init);
</script>
